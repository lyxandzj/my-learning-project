nc: 10 # 类别数
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 官方骨干网络，确保基线特征提取稳定
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

head:
  # === 创新点 1：非对称颈部网络 (Asymmetric Neck) ===
  # 深层 P5 特征冗余大，强制使用 C3_UAV 轻量化压缩
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [512, False]]  # 13 (轻量化深层)

  # 浅层 P3 特征包含了小目标关键细节，坚决保留原版 C3k2，不压缩
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]  # 16 (P3 输出，通道: 256)

  # 下采样深层，继续使用 C3_UAV 削减冗余
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [512, False]]  # 19 (P4 输出，通道: 512)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [1024, False]]  # 22 (P5 输出，通道: 1024)

  # === 创新点 2：通道对齐与跨尺度共享头 (Shared Head) ===
  # 为了让头部的参数能够共享，必须用 1x1 卷积将 P4 和 P5 的通道强制降维到 256
  - [19, 1, Conv, [256, 1, 1]] # 23 (将 P4 的 512 -> 256)
  - [22, 1, Conv, [256, 1, 1]] # 24 (将 P5 的 1024 -> 256)

  # 输入的通道数现在全部严格等于 [256, 256, 256]，满足共享头的前提
  - [[16, 23, 24], 1, SharedDetect, [nc]]  # 25