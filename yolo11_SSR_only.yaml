# ==========================================
# 消融实验：仅测试 SSR-Backbone 的有效性
# 不包含 P2头，不包含 EMA，恢复官方 3 输出头
# ==========================================

nc: 10 # 类别数
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2

  # === 本文设计的 SSR-Backbone ===
  - [-1, 1, SPDConv, [128]] # 1-P2/4 (无损下采样)
  - [-1, 2, C3_SGRF, [256, False, 0.5]] # 2 (慢增长特征提取.之前为了极致轻量化，我们在 SGRF 模块里设置了通道膨胀率 e=0.25。现在我们把它调回到标准的 0.5，让浅层网络有更多的参数去记忆小目标的特征)
  - [-1, 1, SPDConv, [256]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4(重点！这里换回了 C3k2，让网络能看清大卡车)
  - [-1, 1, SPDConv, [512]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, SPDConv, [1024]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  # ===============================

  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # 完全恢复官方 YOLO11 的标准颈部网络
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 拼接 P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 拼接 P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3 预测层)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 19 (P4 预测层)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 22 (P5 预测层)

  - [[16, 19, 22], 1, Detect, [nc]] # 23 (仅保留原版的3个预测头)
