# ==========================================
# 论文网络：融合 P2微小目标检测头 + C3_UAV轻量化模块
# ==========================================

# 基础参数设定
nc: 80 # 填入 VisDrone 类别数，通常转好后是 10
scales:
  n: [0.50, 0.25, 1024] # 继承 yolo11n 的超轻量缩放系数

# YOLO11 主干网络 (Backbone)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4 (重点！高分辨率层，包含小目标信息)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# YOLO11 颈部与头部 (Neck & Head) - 全面采用 C3_UAV 替换
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [512, False]]  # 13 (替换了原版的 C3k2)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [256, False]]  # 16

  # =========================================
  # 创新点1：继续上采样，增设 P2 极小目标专属预测头
  # =========================================
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]  # 融合来自 backbone 的 P2 层
  - [-1, 2, C3_UAV, [128, False]]  # 19
  - [-1, 1, EMA, [128]]  # 20 在最高分辨率层强行插入 EMA 注意力，抓取无人机航拍微小细节！

  # =========================================
  # 下采样融合路径
  # =========================================
  - [-1, 1, Conv, [128, 3, 2]] # 21 下采样
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [256, False]]  # 23

  - [-1, 1, Conv, [256, 3, 2]] # 24 下采样
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [512, False]]  # 26

  - [-1, 1, Conv, [512, 3, 2]] # 27 下采样
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3_UAV, [1024, True]]  # 29

  # 最终输出！从 3个头 变成 4个头：Detect(P2, P3, P4, P5)
  - [[20, 23, 26, 29], 1, Detect, [nc]]  # 30