# ==========================================
# 终极形态架构：算力再分配 + BiFPN 双向自适应特征融合
# ==========================================
nc: 10
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 彻底重构的骨干网络 (保留上一轮截断 P5 的成果)
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, GhostC3k2, [256, False, 0.25]] # 2 (P2 特征输出层，索引 2)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, GhostC3k2, [512, False, 0.25]] # 4 (P3 特征输出层，索引 4)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, GhostC3k2, [512, True]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7
  - [-1, 2, C2PSA, [512]] # 8 (P4 顶级特征，索引 8)

head:
  # =======================================
  # BiFPN 阶段 1：自顶向下 (Top-Down) 路径
  # =======================================
  - [8, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  # 融合: P3原始特征(4) + P4上采样(9)。摒弃Concat，使用归一化加权
  - [[4, 9], 1, BiFPN_Fusion, []] # 10 (通道对齐到 512)
  - [-1, 2, C3_UAV, [512, False]] # 11 (此即为 P3_td)

  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  # 融合: P2原始特征(2) + P3_td上采样(12)
  - [[2, 12], 1, BiFPN_Fusion, []] # 13 (通道对齐到 256)
  - [-1, 2, C3_UAV, [256, False]] # 14 (此即为 P2_out)

  # =======================================
  # BiFPN 阶段 2：自底向上 (Bottom-Up) 路径 (带跨尺度跳跃连接)
  # =======================================
  - [14, 1, Conv, [256, 3, 2]] # 15 (下采样 P2_out)
  # 💡 核心三边融合节点: P3原始(4) + P3_td(11) + P2下采样(15)！引入跨越边防特征丢失
  - [[4, 11, 15], 1, BiFPN_Fusion, []] # 16 (通道对齐到 512)
  - [-1, 2, C3_UAV, [512, False]] # 17 (此即为 P3_out)

  - [17, 1, Conv, [512, 3, 2]] # 18 (下采样 P3_out)
  # 融合: P4原始特征(8) + P3_out下采样(18)
  - [[8, 18], 1, BiFPN_Fusion, []] # 19 (通道对齐到 512)
  - [-1, 2, C3_UAV, [512, False]] # 20 (此即为 P4_out)

  # =======================================
  # 截断式检测头：专注于无人机微小目标 [P2, P3, P4]
  # =======================================
  - [[14, 17, 20], 1, Detect, [nc]] # 21
