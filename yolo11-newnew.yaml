# ==========================================
# 算力再分配架构 (Head Reallocation Net)
# 1. 骨干网络融合 GhostC3k2，物理截断 P5 层
# 2. 颈部网络融合 C3_UAV (PConv)
# 3. 预测头从 [P3, P4, P5] 整体迁移至 [P2, P3, P4]
# ==========================================

nc: 10
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # 彻底重构的骨干网络：剥离密集卷积，最深仅到 P4 层
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, GhostC3k2, [256, False, 0.25]] # 2 (轻量化浅层)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, GhostC3k2, [512, False, 0.25]] # 4 (轻量化中层)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (原版还要继续往下走，我们在这里直接截断！)

  # 💡 核心操作：将金字塔顶端的特征提取器 SPPF 提前到 P4 层
  - [-1, 2, GhostC3k2, [512, True]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7 (挂载在 P4 层，通道数由 1024 暴降至 512)
  - [-1, 2, C2PSA, [512]] # 8 (最高层级确立)

head:
  # --- 算力转移：自顶向下的上采样 ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 拼接 P3 层特征
  - [-1, 2, C3_UAV, [256, False]] # 11 (融合 PConv，优化静态映射)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # 拼接 P2 层高分辨率特征
  - [-1, 2, C3_UAV, [128, False]] # 14 (融合 PConv，处理 P2 细节)

  # --- 算力转移：自底向上的下采样 ---
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, GhostC3k2, [256, False]] # 17 (P3 融合输出)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, GhostC3k2, [512, False]] # 20 (P4 融合输出)

  # 💡 终极检测头再分配：彻底抛弃 P5，专门负责微小目标的 [P2, P3, P4] 独立解耦输出
  - [[14, 17, 20], 1, Detect, [nc]] # 21 (此时 14层是P2，17层是P3，20层是P4)
