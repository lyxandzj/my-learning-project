# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect
# Custom Version: Modified for drone small object detection using CGFA

# Parameters
nc: 80 # number of classes (根据VisDrone数据集，通常修改为10)
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8 (浅层高分辨率特征，对小目标极为重要)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (深层低分辨率语义特征)
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head modified with CGFA
head:
  # --- 自顶向下的特征融合 (Top-down pathway) ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: 第一次上采样，可能产生次像素空间偏移
  - [[-1, 6], 1, CGFA, []] # 12 [修改点1]: 弃用简单的 Concat，使用 CGFA 强制将上采样后的深层特征与主干 P4 特征进行形变对齐融合
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14: 第二次上采样
  - [[-1, 4], 1, CGFA, []] # 15 [修改点2]: 使用 CGFA 将上采样特征与主干 P3 高频特征对齐，极致保护无人机微小目标边缘
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # --- 自底向上的特征融合 (Bottom-up pathway) ---
  # 说明：使用带步长的 Conv 进行下采样不会像 Upsample 那样产生严重的网格对齐问题，
  # 因此在下采样支路保留原生的 Concat，这能大大节约参数量并提高推理速度。
  - [-1, 1, Conv, [256, 3, 2]] # 17: 下采样
  - [[-1, 13], 1, Concat, [1]] # 18: cat head P4 (保留 Concat)
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20: 下采样
  - [[-1, 10], 1, Concat, [1]] # 21: cat head P5 (保留 Concat)
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
